name: QA Bots Multi-CNAE (Continuidade e Regressao)

on:
  workflow_dispatch:

jobs:
  qa-bots-multi-cnae:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Multi-CNAE Persona Bots Swarm
        env:
          API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://www.expertiselicitatoria.com.br/api/v1' }}
          TOTAL_BOTS: '10'
          CONCURRENCY: '5'
        run: node scripts/bots-persona-qa.mjs

      - name: Upload QA Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-bots-qa
          path: relatorio-bots-qa.md
